[build-system]
# Pinned below 1.32: that release emits ``Metadata-Version: 2.5``, which the
# current twine (6.2.0 / packaging 26.2) rejects with "not a valid metadata
# version" — so the artifact cannot be validated or confidently uploaded.
# 1.31.0 and earlier emit 2.4, which the whole toolchain accepts. Lift the pin
# once twine and PyPI handle 2.5.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "relational-schema-analyzer"
version = "0.8.0"
description = "Analyze a relational database schema into a conceptual model (OWL-capable) with mapping back to the source schema."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Arthur Keen" }]
keywords = ["relational", "schema", "ontology", "owl", "conceptual-model", "postgres", "mysql", "snowflake"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
]

[project.optional-dependencies]
# Class-abstraction discovery. Shared with arangodb-schema-analyzer so the two cannot
# drift on the sharedProperties/partialProperties split, which decides whether an
# aggregate over an abstract class silently under-reports.
taxonomy = ["conceptual-taxonomy>=0.1.1"]
postgres = ["psycopg[binary]>=3"]
mysql = ["pymysql>=1"]
sqlserver = ["pymssql>=2"]
snowflake = ["snowflake-connector-python>=3"]
duckdb = ["duckdb>=1"]
databricks = ["databricks-sql-connector>=3"]
osi = ["pyyaml>=6"]
csv = ["polars>=0.20"]
owl = ["rdflib>=7"]
openai = ["openai>=1"]
anthropic = ["anthropic>=0.30"]
openrouter = ["httpx>=0.27"]
# Upper-bounded deliberately: mcp 2.0 removed the bundled `mcp.server.fastmcp`
# (it ships a new `MCPServer` API instead, and FastMCP moved to its own package),
# so `mcp_server.py` — written against the 1.x FastMCP API — exits with
# SystemExit(1) on import there. `mcp>=1` silently resolved to 2.0 and shipped a
# broken optional feature. Lift the bound only with the port; see
# docs/IMPLEMENTATION-PLAN.md.
mcp = ["mcp>=1,<2"]
# `mcp` is listed here because `tests/test_mcp_server.py` needs it; it was only ever
# present incidentally, which is why local runs sat on an old 1.x while CI resolved
# 2.0 and failed. Same drift as the ruff bound above: an unpinned dependency plus a
# stale local install reads as green right up until CI installs fresh.
dev = ["pytest>=8", "ruff>=0.5", "fakesnow>=0.11", "snowflake-connector-python>=3", "duckdb>=1", "pyyaml>=6", "mypy>=1.10", "mcp>=1,<2"]

[project.scripts]
relational-schema-analyzer = "relational_schema_analyzer.cli:main"
relational-schema-analyzer-mcp = "relational_schema_analyzer.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ArthurKeen/relational-schema-analyzer"
Repository = "https://github.com/ArthurKeen/relational-schema-analyzer"
Issues = "https://github.com/ArthurKeen/relational-schema-analyzer/issues"

[tool.hatch.build.targets.wheel]
packages = ["relational_schema_analyzer"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Declared explicitly rather than inherited. Ruff's *default* rule set is a moving
# target across minor versions: 0.16 folded UP / RUF / S / ISC / PYI / SIM into the
# defaults, which turned CI red with 236 errors in files nobody had touched — and
# kept it red from 2026-08-04 through two release attempts, because local installs
# were still on 0.15. Naming the rules makes lint reproducible; widening the set is
# then a deliberate commit with the fixes attached, not a surprise from a dependency
# resolving a day later.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: live-database tests; require RUN_INTEGRATION=1 and a per-dialect DSN (opt-in, not run by default)",
]
